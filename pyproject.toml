[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-compression-api"
version = "0.1.0"
description = "Knowledge distillation + quantization pipeline with a benchmarked FastAPI inference service."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "John Quevedo" }]

# Runtime deps are pinned in requirements.txt to keep CPU/GPU installs flexible.
dependencies = []

[project.scripts]
mcapi = "mcapi.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
